name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    name: Lint, compile, and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ends of the Python range declared in pyproject.toml
        python-version: [ '3.10', '3.12' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install check dependencies
        # Proxyshop's runtime dependencies are Windows only, so this installs just the
        # tools needed to lint, byte-compile, and run the platform independent tests.
        run: python -m pip install --upgrade pip ruff pytest packaging

      - name: Byte-compile
        run: python -m compileall -q src plugins main.py

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
